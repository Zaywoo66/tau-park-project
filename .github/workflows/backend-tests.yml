name: Backend tests and Compose smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_USER: tau_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: tau_park_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tau_test -d tau_park_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r backend/requirements-test.txt
      - name: Test authentication and booking against disposable PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://tau_test:test-only-password@127.0.0.1:5432/tau_park_test
          SECRET_KEY: test-only-key-never-use-for-a-real-deployment
        run: python -m pytest -q backend/tests

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate and start the documented stack
        run: |
          docker compose --project-name tau-park-ci --env-file .env.example config --quiet
          timeout 12m docker compose --project-name tau-park-ci --env-file .env.example up --build -d --wait
          curl --fail --show-error http://127.0.0.1:8000/
          curl --fail --show-error http://127.0.0.1:8080/
      - name: Remove only this job's containers and volume
        if: always()
        run: docker compose --project-name tau-park-ci --env-file .env.example down --volumes --remove-orphans

